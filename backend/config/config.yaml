trading:
  trade_size_eur: 1.00
  entry_size_shares: 2
  entry_price_target: 0.50
  entry_price_max_deviation: 0.02
  trigger_threshold: 0.73
  target_exit: 0.80
  stop_exit: 0.60
  entry_cutoff_minutes_before_window: 2
  entry_start_minutes_before_window: 45
  # legacy exit_strategy removed — see top-level exit: block

exit:
  # Peg-Cross exit engine (Höschler/Bulthuis V2)
  cross_threshold: 0.72        # peg-cross score threshold (0-1) to convert limit→market
  initial_offset: 0.07         # limit starts trigger_price + offset above trigger
  ratchet_buffer: 0.03         # limit stays this far above mid when ratcheting
  min_winner_profit_margin: 0.01  # resting limit sits at least break_even + this
  check_interval_seconds: 1.5  # polling interval in patient phase
  time_urgency_window: 120     # seconds over which time_urgency ramps 0→1
  spread_avg_window: 60        # reserved for future spread averaging
  force_exit_seconds: 30       # market-sell with this many seconds left
  hold_for_resolution_mid_threshold: 0.55  # if mid >= this at force_exit, hold to $1.00 resolution
  # Loser-side passive limit at trigger time (live mode only).
  # Places a resting limit at effective_bid + bid_buffer, undercutting existing asks.
  # Any incoming buyer fills against our order. Falls back to market if timeout expires.
  pre_exit_limit_bid_buffer: 0.06   # limit price = effective_bid + this — raised 0.04→0.06 for lower break-even
  pre_exit_limit_timeout: 25        # seconds to wait — raised 20→25 for more fill time
  pre_exit_limit_min_seconds_left: 90  # skip passive limit if window expires within this many seconds
  # Early loser sell: market-sell the declining side during monitoring (before trigger fires).
  # Data shows bid ~0.316 at 0.45 mid vs ~0.165 at trigger — nearly double the exit price.
  # Override per regime in regime_profiles (use null to disable for a specific regime).
  early_loser_threshold: 0.47       # sell loser when its mid drops below this (raised 0.45→0.47 for earlier capture)
  early_loser_winner_min: 0.57      # other side must be above this (confirms direction)
  early_loser_rebuy_threshold: 0.55 # rebuy if sold side recovers above this (null = disabled)
  early_loser_cooldown_secs: 90     # wait at least this long after entry fill before selling early
  # Loss-control knobs — cap the magnitude of peg_cross / force-exit losses.
  winner_max_loss_per_trade_eur: 0.70  # hard stop: exit winner when (break_even - eff_bid)*size >= this
  winner_velocity_stop: -0.004         # ¢/sec decline rate that triggers early exit (must be < current_limit - 0.05)
  hold_for_resolution_ev_floor: true   # only hold to resolution if mid >= break_even (EV-positive)

entry:
  max_combined_cost: 1.02      # YES ask + NO ask must be ≤ this (stricter = lower break-even)
  max_token_spread: 0.05       # per-token bid/ask spread must be ≤ this

coins:
  BTC:
    enabled: true
    max_parallel_positions: 5
    market_filter: "btc-updown-5m"
    trigger_threshold: 0.75    # BTC is more volatile; higher bar reduces stop-outs
    ratchet_buffer: 0.025      # wider buffer for BTC volatility
  ETH:
    enabled: true
    max_parallel_positions: 5
    market_filter: "eth-updown-5m"
    initial_offset: 0.06       # more ambitious target on ETH
    ratchet_buffer: 0.03
  SOL:
    enabled: true
    max_parallel_positions: 5
    market_filter: "sol-updown-5m"
    # SOL — herziene parameters (Herzie Strategie): peg_cross verlies -€29.12;
    # geduldiger exit + winnaars vaker naar $1.00-resolutie houden.
    trigger_threshold: 0.76
    ratchet_buffer: 0.035
    hold_for_resolution_mid_threshold: 0.58
  XRP:
    enabled: true
    max_parallel_positions: 5
    market_filter: "xrp-updown-5m"
    trigger_threshold: 0.72    # XRP best performer, lower bar
    initial_offset: 0.04
    ratchet_buffer: 0.02
  DOGE:
    enabled: true
    max_parallel_positions: 5
    market_filter: "doge-updown-5m"
    trigger_threshold: 0.74

fees:
  # Taker fee peaks at peak_rate_pct near 50¢ probability, scales to 0 at 0¢/100¢.
  # Formula: rate(p) = peak_rate_pct/100 * min(p, 1-p) / 0.5
  # Maker orders (passive limit fills) pay zero fee.
  peak_rate_pct: 1.80      # % at p=0.50 — 1.80% for Polymarket crypto markets
  maker_rate_pct: 0.00
  paper_slippage_per_share: 0.005   # 0.5¢ per share extra pessimism in paper mode

risk:
  daily_loss_limit_eur: 10.00
  daily_coin_loss_limit_eur: 5.00   # per-coin dag-cap; guard schakelt coin uit bij ≤ -€5
  max_trades_per_day_total: 8000
  global_max_positions: 25

polymarket:
  clob_rest_url: "https://clob.polymarket.com"
  clob_ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  gamma_url: "https://gamma-api.polymarket.com"
  chain_id: 137

learning:
  min_trades_per_coin: 15      # minimum paper trades per coin before analysis (75 total vs 250 old)
  max_learn_hours: 2
  max_live_trades: 15          # re-analyze after 15 live trades for faster iteration
  max_live_hours: 1            # re-analyze every hour
  max_live_loss: 20.00         # EUR emergency stop for live phase
  min_validate_trades: 15
  max_validate_hours: 1
  confidence_threshold: 0.60
  min_deploy_coins: 3          # require Claude-confidence on ≥ this many coins to go live (auto-capped to # enabled)
  analyze_max_retries: 3       # retry transient Claude analyze failures before abandoning the cycle

claude:
  model: "claude-sonnet-4-6"
  max_tokens: 4096

dashboard:
  host: "0.0.0.0"
  port: 8000
  auth_user: "admin"

bias:
  max_weight_ratio: 2.0     # biased side gets up to 2× size when certainty = 1.0
  min_certainty: 0.20       # ignore bias below this score to avoid marginal signals

conviction_weighting:
  enabled: false            # set true to activate conviction-driven asymmetric sizing
  min_score: 0.45           # below this score = symmetric entry (1€/1€)
  max_ratio: 2.0            # at score=1.0 → biased side gets max_ratio× the base size
  # Example: score=0.65, min=0.45, max=2.0 → weight = 1 + (0.65-0.45)/(1-0.45)*1 = 1.36×
  # Use the Scenario Replay → Gewogen inkoop tab to backtest before enabling.

logging:
  level: "INFO"
  db_path: "data/trades.db"

ab_test:
  conviction_threshold: 0.0   # set to e.g. 0.55 to activate conviction-gated trading

directional_entry:
  enabled: true
  conviction_threshold: 0.70     # conviction >= this → buy only biased side (no straddle handicap)
  straddle_min_conviction: 0.45  # conviction 0 < score < this → skip trade entirely
  min_depth_shares: 20           # top-3 ask levels must hold >= 20 shares before going directional
  pricing_model:
    enabled: true
    min_edge: 0.04               # skip directional (fall back to straddle) if |theoretical - market| < this

# Learned parameter profiles per detected market regime.
# Applied on top of global exit: config and per-coin overrides.
# trigger_threshold_delta: added to the coin's base trigger_threshold (clamped 0.65–0.85).
# Updated automatically by the learning cycle when a regime is dominant during analysis.
regime_profiles:
  TRENDING:
    cross_threshold: 0.72     # patient — momentum continues, hold the winner longer
    initial_offset: 0.08      # more ambitious target
    ratchet_buffer: 0.03
    trigger_threshold_delta: 0.00
    early_loser_threshold: 0.45     # sell loser early — trend will continue
    early_loser_rebuy_threshold: null  # no rebuy in trending (direction won't reverse)
  CHOPPY:
    cross_threshold: 0.55     # aggressive exit — reversals are frequent
    initial_offset: 0.04
    ratchet_buffer: 0.02
    trigger_threshold_delta: 0.04   # raise bar — reduce false triggers
    early_loser_threshold: 0.44     # more conservative — wait for more confirmation
    early_loser_rebuy_threshold: 0.54  # rebuy if wrong side recovers (choppy = reversals)
  RANGING:
    cross_threshold: 0.65
    initial_offset: 0.05
    ratchet_buffer: 0.025
    trigger_threshold_delta: 0.02
    early_loser_threshold: null     # disabled — mean reversion likely (both return to 0.50)
  BREAKOUT:
    cross_threshold: 0.72
    initial_offset: 0.04      # lower target — capture the fast initial spike
    ratchet_buffer: 0.02
    trigger_threshold_delta: -0.02  # lower bar — fire earlier on explosive moves
    early_loser_threshold: 0.46     # sell early — breakout won't reverse
    early_loser_rebuy_threshold: null
  NORMAL:
    cross_threshold: 0.72
    initial_offset: 0.07
    ratchet_buffer: 0.03
    trigger_threshold_delta: 0.00
    early_loser_threshold: 0.45
    early_loser_rebuy_threshold: 0.55
