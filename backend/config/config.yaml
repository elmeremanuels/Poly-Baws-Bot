trading:
  trade_size_eur: 1.00
  max_scalein_eur: 0.00        # max extra EUR the bot may spend scaling into ONE position (0 = disabled)
  entry_size_shares: 2
  entry_price_target: 0.50
  entry_price_max_deviation: 0.02
  trigger_threshold: 0.73
  target_exit: 0.80
  stop_exit: 0.60
  entry_cutoff_minutes_before_window: 2
  entry_start_minutes_before_window: 45
  # legacy exit_strategy removed — see top-level exit: block

exit:
  # Peg-Cross exit engine (Höschler/Bulthuis V2)
  cross_threshold: 0.72        # peg-cross score threshold (0-1) to convert limit→market (patient phase, >90s left)
  urgent_cross_threshold: 0.50 # peg-cross threshold in urgent phase (30-90s left); per-regime override raises this
  initial_offset: 0.07         # limit starts trigger_price + offset above trigger
  ratchet_buffer: 0.03         # limit stays this far above mid when ratcheting
  min_winner_profit_margin: 0.01  # resting limit sits at least break_even + this
  check_interval_seconds: 1.5  # polling interval in patient phase
  time_urgency_window: 120     # seconds over which time_urgency ramps 0→1
  spread_avg_window: 60        # reserved for future spread averaging
  force_exit_seconds: 30       # market-sell with this many seconds left
  hold_for_resolution_mid_threshold: 0.55  # if mid >= this at force_exit, hold to $1.00 resolution
  # Loser-side passive limit at trigger time (live mode only).
  # Places a resting limit at effective_bid + bid_buffer, undercutting existing asks.
  # Any incoming buyer fills against our order. Falls back to market if timeout expires.
  pre_exit_limit_bid_buffer: 0.06   # limit price = effective_bid + this — raised 0.04→0.06 for lower break-even
  pre_exit_limit_timeout: 25        # seconds to wait — raised 20→25 for more fill time
  pre_exit_limit_min_seconds_left: 90  # skip passive limit if window expires within this many seconds
  # Early loser sell: market-sell the declining side during monitoring (before trigger fires).
  # Data shows bid ~0.316 at 0.45 mid vs ~0.165 at trigger — nearly double the exit price.
  # Override per regime in regime_profiles (use null to disable for a specific regime).
  # DATA: early_loser_was_winner = 28 trades, -€67.78 (avg -€2.42) — main loss driver.
  # Root cause: winner_min 0.63 is too close to trigger (0.65-0.85), reversal easy.
  # Fix: raise winner_min→0.72, lower sell threshold→0.36, add 3 new safety gates.
  early_loser_threshold: 0.36         # was 0.42 — sell only when loser is at 36% (not 42%)
  early_loser_winner_min: 0.72        # was 0.63 — winner must be genuinely leading (72%)
  early_loser_rebuy_threshold: 0.55   # rebuy if sold side recovers above this (null = disabled)
  early_loser_cooldown_secs: 90       # wait at least this long after entry fill before selling early
  early_loser_min_secs_below: 45      # NEW: loser must be below threshold for 45s straight (no spikes)
  early_loser_velocity_gate: true     # NEW: only sell if loser price still falling (not stabilizing)
  # Loss-control knobs — cap the magnitude of peg_cross / force-exit losses.
  # DATA 27-05: winner_stop_loss veroorzaakte -€40.95 over 35 trades (25 correcte richtingen afgekapt).
  # Uitgeschakeld: peg_cross en force_exit handelen de exit — stop snijdt te vroeg in winnende trades.
  winner_max_loss_per_trade_eur: null  # null = uitgeschakeld; was 0.70
  winner_velocity_stop: null           # null = uitgeschakeld; was -0.004 ¢/sec
  hold_for_resolution_ev_floor: true   # only hold to resolution if mid >= break_even (EV-positive)

entry:
  max_combined_cost: 1.02      # YES ask + NO ask must be ≤ this (stricter = lower break-even)
  max_token_spread: 0.05       # per-token bid/ask spread must be ≤ this

coins:
  BTC:
    enabled: true
    max_parallel_positions: 5
    market_filter: "btc-updown-5m"
    trigger_threshold: 0.75    # BTC is more volatile; higher bar reduces stop-outs
    ratchet_buffer: 0.025      # wider buffer for BTC volatility
  ETH:
    enabled: true
    max_parallel_positions: 5
    market_filter: "eth-updown-5m"
    initial_offset: 0.06       # more ambitious target on ETH
    ratchet_buffer: 0.03
  SOL:
    enabled: true
    max_parallel_positions: 5
    market_filter: "sol-updown-5m"
    # SOL — herziene parameters (Herzie Strategie): peg_cross verlies -€29.12;
    # geduldiger exit + winnaars vaker naar $1.00-resolutie houden.
    trigger_threshold: 0.76
    ratchet_buffer: 0.035
    hold_for_resolution_mid_threshold: 0.58
  XRP:
    enabled: true
    max_parallel_positions: 5
    market_filter: "xrp-updown-5m"
    trigger_threshold: 0.72    # XRP best performer, lower bar
    initial_offset: 0.04
    ratchet_buffer: 0.02
  DOGE:
    enabled: true
    max_parallel_positions: 5
    market_filter: "doge-updown-5m"
    trigger_threshold: 0.74

fees:
  # Taker fee peaks at peak_rate_pct near 50¢ probability, scales to 0 at 0¢/100¢.
  # Formula: rate(p) = peak_rate_pct/100 * min(p, 1-p) / 0.5
  # Maker orders (passive limit fills) pay zero fee.
  peak_rate_pct: 1.80      # % at p=0.50 — 1.80% for Polymarket crypto markets
  maker_rate_pct: 0.00
  paper_slippage_per_share: 0.005   # 0.5¢ per share extra pessimism in paper mode

coin_guard:
  paper_only_recovery_wins: 3   # consecutive paper-wins needed to auto-recover from paper_only state

risk:
  daily_loss_limit_eur: 10.00
  daily_coin_loss_limit_eur: 25.00  # per-coin dag-cap; verhoogd 5→25 (signal_trader tradeert €10/trade — €5 was te krap)
  max_trades_per_day_total: 8000
  global_max_positions: 25
  max_consecutive_losses: 7          # hard kill after N losses in a row (0 = disabled)
  min_capital_eur: 15.00             # hard stop if USDC drops below this absolute floor
  max_drawdown_from_peak_pct: 25     # hard stop if portfolio drops >25% from its peak
  max_drawdown_from_start_pct: 40    # hard stop if portfolio drops >40% from start capital

router:
  enabled: true
  paper_mode: true                    # true = straddle bucket simulated; false = live orders
  signal_trader_priority: true       # signal bucket always wins when conviction qualifies
  signal_min_conviction: 0.55        # lower bound for signal bucket
  straddle_min_conviction: 0.70      # lower bound for straddle bucket
  straddle_asym_regime: ["RANGING"]  # regimes that get asymmetric straddle sizing
  max_correlated_positions: 3        # block new trade if ≥N open trades share same direction
  take_it_size_eur: 3.00             # extra EUR per "Take it" buy
  save_it_size_eur: 3.00             # extra EUR per "Save it" buy
  take_it_enabled: true
  save_it_enabled: true

ab_test:
  conviction_threshold: 0.0          # set to 0.55 to activate B-group filtering

polymarket:
  clob_rest_url: "https://clob.polymarket.com"
  clob_ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  gamma_url: "https://gamma-api.polymarket.com"
  chain_id: 137

learning:
  min_trades_per_coin: 10      # minimum paper trades per coin before analysis (50 total)
  max_learn_hours: 1
  max_live_trades: 20          # re-analyze after 20 live trades
  max_live_hours: 1            # re-analyze every hour
  max_live_loss: 20.00         # EUR emergency stop for live phase
  min_validate_trades: 15
  max_validate_hours: 1
  confidence_threshold: 0.60
  min_deploy_coins: 3          # require Claude-confidence on ≥ this many coins to go live (auto-capped to # enabled)
  analyze_max_retries: 3       # retry transient Claude analyze failures before abandoning the cycle

claude:
  model: "claude-sonnet-4-6"
  max_tokens: 4096

dashboard:
  host: "0.0.0.0"
  port: 8000
  auth_user: "admin"

bias:
  max_weight_ratio: 2.0     # biased side gets up to 2× size when certainty = 1.0
  min_certainty: 0.99       # effectively disabled — set to 0.20 to re-activate

conviction_weighting:
  enabled: false            # UITGESCHAKELD — weighting_guard heractiveerd als accuracy >53%
  min_score: 0.45           # below this score = symmetric entry (1€/1€)
  max_ratio: 1.5            # at score=1.0 → biased side gets 1.5× the base size
  # Use the Scenario Replay → Gewogen inkoop tab to backtest before enabling.

trading_hours:
  # DATA 27-05: uur 02:00 UTC (+€8.92, 83% WR), 04:00 UTC (+€10.91, 87% WR)
  #             uur 05:00 UTC (-€8.21, 41% WR), 07:00 UTC (-€6.73, 43% WR)
  enabled: true
  skip_utc_hours: [5, 7, 8, 12, 14, 18]  # DATA 1287 trades: 08=-€6.92(55%WR), 12=-€9.38(35%), 14=-€6.75(33%), 18=-€10.30(29%)

weighting_guard:
  enabled: true             # auto-disables conviction_weighting / directional_entry on poor performance
  eval_interval_secs: 1800  # re-evaluate every 30 minutes
  min_trades: 20            # minimum trades before making a decision (verhoogd voor betrouwbaarheid)
  disable_threshold: 0.45   # disable if direction accuracy < this (ruim onder coin-flip)
  enable_threshold: 0.55    # re-enable if accuracy >= this
  auto_reenable: true       # allow auto re-enable when accuracy recovers

logging:
  level: "INFO"
  db_path: "data/trades.db"

signal_trader:
  # Single-side modus: koopt ALLEEN de voorspelde winnende kant.
  # Geen stop loss, geen trailing exit, geen peg-cross. Houdt tot resolution.
  # Break-even bij ~52ct inkoop: 52.0% accuracy vereist.
  # DATA handoff 27-05: 73.8% signaal accuracy → +€356 netto op 80 trades.
  conviction_threshold: 0.50    # DATA: score 0.40-0.55 → -€0.25 avg_pnl (direction right, exits hurt); 0.55-0.70 → +€0.24
  entry_min_window_mins_remaining: 2.0  # minimaal N minuten resterend in window om in te stappen
  trade_size_eur: 10.00         # inleg per trade in EUR
  entry_price_max: 0.65         # max entry prijs per share; hogere waarde nodig voor in-window trading
  paper_mode: true              # true = gesimuleerde orders (start altijd paper!)
  max_concurrent_positions: 10  # max gelijktijdige open posities (alle coins samen)
  max_correlated_positions: 2   # max gelijktijdige posities in DEZELFDE richting (anti macro-bet)
  max_daily_loss_eur: 50.00     # dagelijks verlies limiet
  max_trades_per_day: 200       # max trades per dag
  respect_trading_hours: false  # false = negeert skip_utc_hours (conviction-gate is genoeg)
  # Take it / Save it — maximale winst strategie
  take_it_enabled: true
  take_it_threshold: 0.82        # positie moet op >= 82ct staan om bij te kopen
  take_it_max_secs_remaining: 180 # alleen als <= 3 min resterend (move bevestigd)
  take_it_size_eur: 3.00         # extra inleg bij Take it
  save_it_enabled: true
  save_it_drop: 0.15             # positie moet >= 15ct gezakt zijn tov entry
  save_it_other_threshold: 0.55  # andere kant moet >= 55ct zijn om hedge te kopen
  save_it_min_secs_remaining: 60 # minimaal 60s resterend voor Save it
  save_it_size_eur: 3.00         # inleg hedge bij Save it
  coins:
    BTC:
      enabled: true
    ETH:
      enabled: true
    SOL:
      enabled: true
    XRP:
      enabled: false            # 50% accuracy in data — uitgeschakeld
    DOGE:
      enabled: true

directional_entry:
  # ANALYSE 1287 trades: directional €10 per trade → -€994.83 netto over 332 trades.
  # Conviction-richting is slechts 50.3% correct (muntenworp).
  # Asymmetrie: goed = +€4-6, fout = -€10 → structureel verliesgevend.
  # Straddle is superieur: houdt altijd de winnende kant, richting irrelevant.
  enabled: false
  conviction_threshold: 0.65     # ongebruikt zolang enabled: false
  straddle_min_conviction: 0.45  # trades <0.45 worden overgeslagen (geen straddle)
  min_depth_shares: 20           # top-3 ask levels must hold >= 20 shares before going directional
  pricing_model:
    enabled: true
    min_edge: 0.04               # skip directional (fall back to straddle) if |theoretical - market| < this

# Learned parameter profiles per detected market regime.
# Applied on top of global exit: config and per-coin overrides.
# trigger_threshold_delta: added to the coin's base trigger_threshold (clamped 0.65–0.85).
# Updated automatically by the learning cycle when a regime is dominant during analysis.
regime_profiles:
  TRENDING:
    cross_threshold: 0.88     # very patient — peg_cross lost €47 here; ride to force_exit/resolution
    urgent_cross_threshold: 0.78  # urgent-phase (30-90s) bar raised from default 0.50 — only convert on genuine collapse
    initial_offset: 0.08      # more ambitious target
    ratchet_buffer: 0.03
    trigger_threshold_delta: 0.00
    early_loser_threshold: null     # disabled — dumped side won anyway 60×, costing €60 (was 0.45)
    early_loser_rebuy_threshold: null
    winner_velocity_stop: null      # disabled — 14/14 velocity-stop exits were direction-correct, cut winners for ~€4.6
  CHOPPY:
    cross_threshold: 0.55     # aggressive exit — reversals are frequent
    initial_offset: 0.04
    ratchet_buffer: 0.02
    trigger_threshold_delta: 0.04   # raise bar — reduce false triggers
    early_loser_threshold: null     # disabled — reversals define choppy; early sell = wrong side too often
    early_loser_rebuy_threshold: null
  RANGING:
    cross_threshold: 0.65
    initial_offset: 0.05
    ratchet_buffer: 0.025
    trigger_threshold_delta: 0.02
    early_loser_threshold: null     # disabled — mean reversion likely (both return to 0.50)
    winner_velocity_stop: null      # disabled — velocity stop bailed winners at 0.726 vs 0.871 limit fill, cost €29
  BREAKOUT:
    cross_threshold: 0.72
    initial_offset: 0.04      # lower target — capture the fast initial spike
    ratchet_buffer: 0.02
    trigger_threshold_delta: -0.02  # lower bar — fire earlier on explosive moves
    early_loser_threshold: null     # disabled — 4/7 BREAKOUT trades dumped the actual winner early, cost €8.1
    early_loser_rebuy_threshold: null
    winner_velocity_stop: null      # disabled — same direction-correct cut as other regimes
  NORMAL:
    cross_threshold: 0.85     # patient — peg_cross lost €62 here; ride to force_exit/resolution
    urgent_cross_threshold: 0.72  # urgent-phase (30-90s) bar raised from default 0.50
    initial_offset: 0.07
    ratchet_buffer: 0.03
    trigger_threshold_delta: 0.00
    early_loser_threshold: 0.38    # was 0.45 — slightly more conservative than global default
    early_loser_rebuy_threshold: 0.55
    winner_velocity_stop: null      # disabled — 7/7 velocity-stop exits were direction-correct, cut winners for ~€1.7

oracle:
  enabled: true
  hard_gate: false                   # zet op true na ~50 verdicts met track record >= 0.55
  per_coin_temp_paper_threshold: 35
  # Discord — vul in via .env of hier direct
  discord_bot_token: ""              # DISCORD_BOT_TOKEN in .env heeft voorrang
  discord_channel_id: "1510017194694807595"    # kanaal voor trade alerts + dagelijkse analyse
  discord_confirm_channel_id: "1510017194694807595"  # kanaal voor interactieve ja/nee vragen
  discord_confirm_enabled: true      # soft-blocks vragen via Discord-knop
  discord_confirm_timeout_secs: 90   # seconden wachten op antwoord (dan auto-approve)
  track_record_min_trades: 10
  temperature_hard_block: 30         # temp < 30 → hard reject (alleen als hard_gate: true)
  temperature_soft_block: 50         # temp < 50 → Discord confirm
  extreme_fear_threshold: 15
  extreme_greed_threshold: 92
  daily_analysis_times_utc: ["07:00", "19:00"]
  paper_continues_on_kill: true
  mid_trade_watch_enabled: true      # Oracle bewaakt actieve trades (temp-drop alerts)
  feeds:
    cryptopanic_token: ""            # CRYPTOPANIC_TOKEN in .env heeft voorrang
    fear_greed_enabled: true
    polymarket_aggregate: true

whale_tracker:
  enabled: true
  sync_interval_secs: 300          # elke 5 minuten synchen
  addresses:
    adelgranadol: "0xb305d384400e3d7a15780216a55368ea677eca4e"
    is5minfixedyet: "0x2bc01f3ad80e31f5bf3d80775b044f0c67797871"

bggdsb:
  coins: ["BTC"]                    # is5minfixedyet handelde vrijwel alleen BTC
  window_budget_eur: 20.0           # volledig budget op dominant kant bij entry
  entry_price_min: 0.10             # market competitive gate — ondergrens
  entry_price_max: 0.90             # market competitive gate — bovengrens
  dom_ask_max: 0.65                 # skip window als dominant kant al > dit (te laat, payout te klein)
  entry_delay_secs: 2               # minimaal 2s na window-start zodat WS orderbook gevuld is
  min_secs_remaining: 30            # alleen instappen als window nog minimaal X seconden duurt
  is5_tiebreak_threshold: 0.03      # als |yes_ask - no_ask| <= dit, gebruik is5 als tiebreaker
  hedge_price_trigger: 0.11         # koop tiny hedge als verliezende kant ≤ dit
  hedge_size_pct: 0.10              # hedge = 10% van window_budget (€2 bij €20 budget)
  avg_down_enabled: true
  avg_down_tranche_pct: 0.50        # 50% van window_budget per avg-down tranche (€1 bij €2, €10 bij €20)
  avg_down_min_drop: 0.08           # buy again als dom prijs > 8ct gezakt is tov laatste koop
  avg_down_interval_secs: 25        # min seconden tussen twee avg-down buys
  avg_down_max_pct: 4.00            # max 4× budget aan avg-down totaal (€8 bij €2, €80 bij €20)
  flip_enabled: true
  flip_trigger_price: 0.62          # koop andere kant als die boven dit stijgt
  flip_tranche_pct: 0.75            # 75% van window_budget per flip tranche (€1.50 bij €2, €15 bij €20)
  flip_interval_secs: 20            # min seconden tussen twee flip buys
  flip_max_pct: 3.00                # max 3× budget aan flip totaal (€6 bij €2, €60 bij €20)
  flip_min_secs_remaining: 60       # geen flip als < 60s resterend
  confirm_enabled: true
  confirm_trigger_price: 0.78       # confirm buy als winnende kant boven dit staat
  confirm_secs_remaining: 90        # alleen confirm in laatste 90s
  confirm_pct: 1.00                 # 100% van window_budget voor confirm buy (€2 bij €2, €20 bij €20)
  paper_mode: true                  # true = paper (safe start)
  streak_min_wins: 1                # minimale winning streak vóór verlies skip-penalty triggert
  streak_skip_count: 2              # aantal windows te skippen na onderbroken streak
