# Streamlit server configuration for Poly-Baws-Bot dashboard

[server]
headless = true                 # no browser auto-open
enableStaticServing = false
runOnSave = false
maxUploadSize = 50
maxMessageSize = 200            # MB — large trade data payloads

[browser]
gatherUsageStats = false

[runner]
fastReruns = true               # skip intermediate state updates for quick reruns

[client]
showErrorDetails = false        # hide raw Python tracebacks from end-user
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#4ade80"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1e2330"
textColor = "#e2e8f0"
font = "monospace"
